services:
  - type: web
    name: clipura-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # $7/month — upgrade to standard for heavier load
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Persistent data lives on the mounted disk so jobs and clips survive restarts.
      - key: DATA_DIR
        value: /var/data
      - key: OPENAI_API_KEY
        sync: false        # set manually in the Render dashboard — never commit keys
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false        # set to your Vercel URL after the frontend deploys
      - key: ACCESS_CODE
        sync: false        # the code you give testers (set in the dashboard)
      - key: DAILY_PROCESSING_MINUTES
        value: 180         # max minutes of source video processed per day
    disk:
      name: clipura-data
      mountPath: /var/data # persists uploads, outputs, data (jobs), yt-dlp binary
      sizeGB: 10           # ~$2.50/month
